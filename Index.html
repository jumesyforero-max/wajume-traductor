<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173f35">
<title>Wajume | Traductor Wamonae - Español</title>
<style>
:root{--green:#173f35;--green2:#235747;--cream:#f7f7f1;--ink:#17241f;--muted:#64736b;--line:#dce5de;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:var(--green);color:#fff;padding:30px 20px 28px;text-align:center}
.logo{width:48px;height:48px;margin:0 auto 12px;border:1px solid #ffffff80;border-radius:16px;display:grid;place-items:center;font-size:25px}
h1{font-size:30px;line-height:1.1;margin:0 0 8px;letter-spacing:.02em}
header p{margin:0;color:#e1eee6;font-size:14px}
main{max-width:650px;margin:22px auto;padding:0 15px 30px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 28px #173f350a}
.langs{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:center;margin-bottom:18px}
.lang{border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#fff;color:var(--ink);font-size:14px;font-weight:650}
.lang.active{background:#e8f1eb;border-color:#a9c5b4;color:var(--green)}
.swap{border:0;background:var(--green);color:white;width:42px;height:42px;border-radius:50%;font-size:21px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px}
textarea{display:block;width:100%;min-height:140px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;font:16px/1.5 inherit;color:var(--ink);background:#fff;outline:none}
textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #23574715}
.actions{display:flex;gap:10px;margin-top:13px}
button{cursor:pointer;font:inherit}
.primary,.secondary{border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700}
.primary{flex:1;background:var(--green);color:#fff;border:1px solid var(--green)}
.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}
.result{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.result-head{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:750;margin-bottom:9px}
#output{font-size:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;min-height:30px}
.status{font-size:12px;color:var(--muted);margin-top:9px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(min-width:560px){main{padding-top:12px}.panel{padding:26px}.lang{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">文</div>
  <h1>WAJUME</h1>
  <p>Traductor Wamonae ↔ Español</p>
</header>
<main>
  <section class="panel">
    <div class="langs" aria-label="Dirección de traducción">
      <button class="lang active" id="fromEs" type="button">Español</button>
      <button class="swap" id="swap" type="button" aria-label="Cambiar dirección" title="Cambiar dirección">⇄</button>
      <button class="lang" id="fromWa" type="button">Wamonae</button>
    </div>
    <label id="inputLabel" for="source">ESCRIBE EL TEXTO EN ESPAÑOL</label>
    <textarea id="source" placeholder="Escribe una palabra o un texto…"></textarea>
    <div class="actions">
      <button class="primary" id="translate" type="button">Traducir</button>
      <button class="secondary" id="clear" type="button">Limpiar</button>
    </div>
    <div class="result">
      <div class="result-head" id="resultLabel">Traducción al Wamonae</div>
      <div id="output">La traducción aparecerá aquí.</div>
      <div class="status" id="status"></div>
    </div>
  </section>
</main>
<footer>Wajume · Nuestra lengua</footer>
<script>
let direction='es';
const $=id=>document.getElementById(id);
function setDirection(d){
 direction=d;
 $('fromEs').classList.toggle('active',d==='es');
 $('fromWa').classList.toggle('active',d==='wa');
 $('inputLabel').textContent=d==='es'?'ESCRIBE EL TEXTO EN ESPAÑOL':'ESCRIBE EL TEXTO EN WAMONAE';
 $('source').placeholder=d==='es'?'Escribe una palabra o un texto en español…':'Escribe una palabra o un texto en Wamonae…';
 $('resultLabel').textContent=d==='es'?'Traducción al Wamonae':'Traducción al español';
 $('output').textContent='La traducción aparecerá aquí.';
 $('status').textContent='';
}
$('fromEs').onclick=()=>setDirection('es');
$('fromWa').onclick=()=>setDirection('wa');
$('swap').onclick=()=>setDirection(direction==='es'?'wa':'es');
$('clear').onclick=()=>{$('source').value='';$('output').textContent='La traducción aparecerá aquí.';$('status').textContent='';};
$('translate').onclick=()=>{
 const text=$('source').value.trim();
 if(!text){$('output').textContent='Escribe el texto que quieres traducir.';$('status').textContent='';return}
 // The dictionary engine will be connected once the approved vocabulary database is prepared.
 $('output').textContent='El diccionario se está preparando.';
 $('status').textContent='La interfaz está lista. Estamos organizando el vocabulario para activar traducciones fiables.';
};
</script>
</body>
</html>
